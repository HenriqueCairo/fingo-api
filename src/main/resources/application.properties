
# Aplicacao FinGo
spring.application.name=fingo-api

# Porta da Render ou ambiente local
server.port=${PORT:8080}

# Banco MySQL - FreeDB
spring.datasource.url=${DB_URL:jdbc:mysql://sql.freedb.tech:3306/freedb_sNYevvI8?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP - configuracao minima para FreeDB
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

# Desabilitar inicializacao SQL automatica
spring.sql.init.mode=never

# Console H2 desabilitado
spring.h2.console.enabled=false

# API Key
fingo.security.api-key.enabled=true
fingo.security.api-key.bootstrap-token=${FINGO_BOOTSTRAP_TOKEN}
fingo.bootstrap-token=${FINGO_BOOTSTRAP_TOKEN:}





