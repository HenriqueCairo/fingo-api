
# =====================================================
# FINGO API - CONFIGURACAO DA APLICACAO
# Java 21 | Spring Boot 4.1.1 | MySQL
# =====================================================

# 1. APLICACAO
spring.application.name=fingo-api

# 2. SERVIDOR
server.port=${PORT:8080}

# 3. BANCO DE DADOS - MYSQL FREEDB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 5. POOL DE CONEXOES - HIKARI
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# 6. CONSOLE H2
spring.h2.console.enabled=false

# 7. AUTENTICACAO POR API KEY
fingo.security.api-key.enabled=true



# 9. SWAGGER / OPENAPI
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# 10. CODIFICACAO
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true




